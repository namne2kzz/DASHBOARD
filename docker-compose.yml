# Backing services + app images for local DASHBOARD development.
# Run:   docker compose up -d        (start in background)
# Stop:  docker compose down          (keep data)
# Reset: docker compose down -v       (wipe all data volumes)
#
# api/web are optional — only built when you run `docker compose build`
# or `up --build`. Day-to-day, the app still runs natively via
# `dotnet run` / `ng serve`; use api/web only when you want to test the
# containerized production build.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dashboard-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./backups:/var/opt/mssql/backup
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: dashboard-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-guest}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS:-guest}"
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI -> http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: dashboard-mailpit
    ports:
      - "1025:1025"     # SMTP (matches EmailSettings.SmtpPort)
      - "8025:8025"     # Web UI -> http://localhost:8025
    restart: unless-stopped

  # Optional — containerized app images, opt-in via the "app" profile.
  # Ignored by plain `docker compose up -d` / `down` / `ps`.
  # Build/run:  docker compose --profile app up -d --build
  # Stop:       docker compose --profile app down
  api:
    build:
      context: .
      dockerfile: DASHBOARD/Dockerfile
    container_name: dashboard-api
    profiles: ["app"]
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      # JWT secret MUST match HUB's JWT_SECRET so tokens issued here validate at the HUB gateway.
      # Production env uses appsettings.json (placeholder secret) — override it here.
      JwtSettings__Secret: "${JWT_SECRET:-dev-secret-key-change-in-production-32chars!}"
      JwtSettings__Issuer: "dashboard-api"
      JwtSettings__Audience: "dashboard-spa"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=DASHBOARD;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;"
      RabbitMq__Username: "${RABBITMQ_USER:-guest}"
      RabbitMq__Password: "${RABBITMQ_PASS:-guest}"
      ConnectionStrings__Redis: "redis:6379"
      # GitHub connection for project "DASH" — real values come only from .env (gitignored),
      # never from appsettings.json/appsettings.Production.json. Add more repos under the same
      # project by appending __1__, __2__... (matching GitConnectionEntry array indices), or add
      # another block for a different project code (e.g. GitConnections__OTHERCODE__0__...).
      GitConnections__DASH__0__RepoUrl: "${GITHUB_REPO_URL_DASH}"
      GitConnections__DASH__0__Token: "${GITHUB_TOKEN_DASH}"
      GitConnections__DASH__0__IsPrimary: "true"
      GitConnections__DASH__1__RepoUrl: "${GITHUB_REPO_URL_DASH_1}"
      GitConnections__DASH__1__Token: "${GITHUB_TOKEN_DASH_1}"
      GitConnections__DASH__1__IsPrimary: "false"
      # Token HUB DashboardGateway gửi khi gọi DASHBOARD /internal/v1/* — phải khớp InternalApi:Token.
      InternalApi__Token: "${INTERNAL_API_TOKEN:-CHANGE_THIS_INTERNAL_TOKEN_MIN_32_CHARS!}"
      # HUB Chat — Docker mode: gọi qua shared network hub-net bằng service name "chat".
      HubChat__BaseUrl: "http://chat:8080"
      HubChat__InternalToken: "${HUB_CHAT_INTERNAL_TOKEN:-CHANGE_THIS_INTERNAL_TOKEN_MIN_32_CHARS!}"
      HubChat__FrontendBaseUrl: "http://localhost:4202"
      # MinIO — trong Docker: gọi qua service name, public URL dùng localhost cho browser.
      MinIO__Endpoint: "http://minio:9000"
      MinIO__AccessKey: "${MINIO_ACCESS_KEY:-minioadmin}"
      MinIO__SecretKey: "${MINIO_SECRET_KEY:-minioadmin}"
      MinIO__AvatarBucket: "dashboard-avatars"
      MinIO__PublicBaseUrl: "http://localhost:9100"
    ports:
      - "55432:8080"
    networks: [default, hub-net]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: DASHBOARD.VIEW/Dockerfile
    container_name: dashboard-web
    profiles: ["app"]
    depends_on:
      api:
        condition: service_started
    ports:
      - "4201:80"
    restart: unless-stopped

  # Browser-based DB admin — http://localhost:8047
  # Supports SQL Server, PostgreSQL, MySQL, SQLite, and more in one UI.
  # Connection to dashboard-sqlserver is pre-configured via env vars (no manual setup).
  dbgate:
    image: dbgate/dbgate:latest
    container_name: dashboard-dbgate
    ports:
      - "8047:3000"
    environment:
      CONNECTIONS: con1
      LABEL_con1: "DASHBOARD (SQL Server)"
      SERVER_con1: sqlserver
      PORT_con1: 1433
      USER_con1: sa
      PASSWORD_con1: "${MSSQL_SA_PASSWORD}"
      DATABASE_con1: DASHBOARD
      ENGINE_con1: mssql@dbgate-plugin-mssql
    volumes:
      - dbgate-data:/root/.dbgate
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dashboard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: dashboard-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin}"
    ports:
      - "9100:9000"   # S3 API  → http://localhost:9100
      - "9101:9001"   # Console → http://localhost:9101
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Optional — uncomment when you start using PostgreSQL (EF Core / Npgsql).
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: dashboard-postgres
  #   environment:
  #     POSTGRES_DB: dashboard
  #     POSTGRES_USER: "${POSTGRES_USER:-postgres}"
  #     POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   restart: unless-stopped

# Shared network với HUB Docker. HUB docker-compose.yml tạo network này khi `docker compose up`.
# Chạy HUB trước, sau đó mới `docker compose --profile app up -d --build` ở DASHBOARD.
networks:
  hub-net:
    external: true
    name: hub-net

volumes:
  sqlserver-data:
  rabbitmq-data:
  redis-data:
  dbgate-data:
  minio-data:
  # postgres-data:
