<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work item state changed — {{WorkItemNumber}}</title>
  <style>
    body  { margin:0; padding:0; background:#f3f4f6; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
    .wrap { max-width:560px; margin:40px auto; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.08); }
    .top  { background:#0ea5e9; padding:28px 40px; text-align:center; }
    .top h1 { margin:0; color:#fff; font-size:20px; font-weight:700; letter-spacing:-.3px; }
    .top p  { margin:6px 0 0; color:#e0f2fe; font-size:13px; }
    .body { padding:36px 40px; }
    .body p { margin:0 0 16px; color:#374151; font-size:15px; line-height:1.65; }
    .change { display:flex; align-items:center; gap:12px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:16px 20px; margin:20px 0; }
    .state  { display:inline-block; padding:4px 12px; border-radius:20px; font-size:13px; font-weight:600; }
    .state--old { background:#f1f5f9; color:#64748b; }
    .state--new { background:#dcfce7; color:#16a34a; }
    .arrow  { color:#94a3b8; font-size:18px; }
    .item-title { font-size:15px; font-weight:600; color:#1e293b; margin:0 0 6px; }
    .item-num   { font-size:12px; color:#94a3b8; font-family:monospace; margin:0 0 20px; }
    .btn-wrap { text-align:center; margin:28px 0 20px; }
    .btn  { display:inline-block; padding:13px 36px; background:#0ea5e9; color:#fff !important;
            border-radius:8px; text-decoration:none; font-size:15px; font-weight:600; }
    .foot { background:#f9fafb; border-top:1px solid #e5e7eb; padding:18px 40px; text-align:center; }
    .foot p { margin:0; font-size:12px; color:#9ca3af; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>State updated</h1>
      <p>{{RepositoryName}}</p>
    </div>
    <div class="body">
      <p>Hi {{RecipientName}},</p>

      <p class="item-num">{{WorkItemNumber}}</p>
      <p class="item-title">{{WorkItemTitle}}</p>

      <div class="change">
        <span class="state state--old">{{OldState}}</span>
        <span class="arrow">→</span>
        <span class="state state--new">{{NewState}}</span>
      </div>

      <p>Changed by <strong>{{ChangedByName}}</strong>.</p>

      <div class="btn-wrap">
        <a href="{{ItemUrl}}" class="btn">View work item</a>
      </div>
    </div>
    <div class="foot">
      <p>You received this because you are assigned to this work item in <strong>{{RepositoryName}}</strong> on NFlow.</p>
    </div>
  </div>
</body>
</html>
