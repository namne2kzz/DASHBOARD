name: CD

# NOT AUTOMATIC YET — runs only when triggered by hand from the Actions tab.
# Once the secrets are in place and the pipeline has been exercised, add:
#   push:
#     branches: [main]
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
      push_images:
        description: Push images to GHCR
        type: boolean
        default: true
      deploy:
        description: Deploy over SSH after pushing images
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  DOTNET_VERSION: "10.0.x"

jobs:
  publish:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: inputs.push_images
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # built-in token; no secret to create

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: DASHBOARD/Dockerfile
          push: ${{ inputs.push_images }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/dashboard-api:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/dashboard-api:latest
          cache-from: type=gha,scope=dashboard-api
          cache-to: type=gha,scope=dashboard-api,mode=max

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: DASHBOARD.VIEW/Dockerfile
          push: ${{ inputs.push_images }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/dashboard-web:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/dashboard-web:latest
          cache-from: type=gha,scope=dashboard-web
          cache-to: type=gha,scope=dashboard-web,mode=max

      - name: Trivy scan (API image)
        if: inputs.push_images
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/dashboard-api:${{ steps.meta.outputs.tag }}
          format: sarif
          output: trivy-api.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"   # set to "1" to block the deploy on HIGH/CRITICAL findings

      - name: Upload Trivy report
        if: inputs.push_images
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-api.sarif

  deploy:
    name: Deploy (${{ inputs.environment }})
    needs: publish
    if: inputs.deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}   # add required reviewers under Settings > Environments
    steps:
      # Required secrets: SSH_HOST, SSH_USER, SSH_KEY, DEPLOY_PATH, HEALTH_URL
      #
      # The host must carry a docker-compose.yml that uses `image:` (NOT `build:`)
      # pointing at GHCR, with the tag read from an environment variable:
      #   api:
      #     image: ghcr.io/namne2kzz/dashboard-api:${DASHBOARD_TAG:-latest}
      # plus a sibling .env file holding `DASHBOARD_TAG=<tag>`.
      # Rollback works by writing the previous tag back into .env and running `up -d` again.
      #
      # EF migrations: DASHBOARD calls Database.MigrateAsync() at startup (Program.cs),
      # mirroring HUB. A new container brings its own schema — no separate step needed.
      # WARNING: migrations do NOT roll back. If a deploy fails after migrations ran,
      #          the rollback below only reverts the image; the schema stays forward.
      #          Every migration must therefore stay backward-compatible with the
      #          preceding image (expand/contract).
      - name: Deploy with rollback on failure
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 15m
          envs: NEW_TAG,HEALTH_URL
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            # ── 1. Remember the running tag so there is a way back ─────────────
            PREV_TAG="$(grep -E '^DASHBOARD_TAG=' .env | cut -d= -f2 || echo '')"
            if [ -z "$PREV_TAG" ]; then
              echo "No DASHBOARD_TAG in .env — treating this as the first deploy; rollback unavailable."
            else
              echo "Current tag: $PREV_TAG"
            fi
            echo "Deploying tag: $NEW_TAG"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # ── 2. Health probe, reused by both the deploy and the rollback ────
            wait_healthy() {
              for i in $(seq 1 30); do
                if curl -fsS "$HEALTH_URL" > /dev/null 2>&1; then
                  echo "Healthy after ${i} attempt(s)."
                  return 0
                fi
                echo "Waiting for the app to come up... (${i}/30)"
                sleep 5
              done
              return 1
            }

            # ── 3. Rollback: restore the previous tag and bring the stack back ─
            rollback() {
              if [ -z "$PREV_TAG" ]; then
                echo "::error::Deploy FAILED and there is no previous tag to fall back to. Manual recovery required."
                exit 1
              fi
              echo "::warning::Deploy FAILED — rolling back to $PREV_TAG"
              sed -i "s|^DASHBOARD_TAG=.*|DASHBOARD_TAG=$PREV_TAG|" .env
              docker compose up -d --remove-orphans
              if wait_healthy; then
                echo "::error::Rolled back to $PREV_TAG. Build $NEW_TAG was rejected."
              else
                echo "::error::ROLLBACK ALSO FAILED. The service is down — manual recovery required now."
              fi
              exit 1
            }

            # ── 4. Deploy ──────────────────────────────────────────────────────
            # Write the new tag: create .env if absent, append the line if missing,
            # only then sed it. (sed -i on a missing file fails, and set -e would
            # kill the script before the append could run.)
            touch .env
            grep -q '^DASHBOARD_TAG=' .env || echo "DASHBOARD_TAG=$NEW_TAG" >> .env
            sed -i "s|^DASHBOARD_TAG=.*|DASHBOARD_TAG=$NEW_TAG|" .env

            docker compose pull        || rollback
            docker compose up -d --remove-orphans || rollback
            wait_healthy               || rollback

            echo "Deploy $NEW_TAG succeeded."
            docker image prune -f
        env:
          NEW_TAG:     ${{ needs.publish.outputs.tag }}
          HEALTH_URL:  ${{ secrets.HEALTH_URL }}
