<div class="flex h-full flex-col">

  <!-- Header -->
  <div class="border-b border-nx-border bg-nx-surface px-8 py-4">
    <h1 class="text-3xl font-bold text-nx-text">{{ t('pipelines.header.title') }}</h1>
  </div>

  <!-- Body -->
  <div class="custom-scroll flex-1 overflow-y-auto p-5">

    <!-- Nothing to show because nothing is connected yet — not a failure, so the bot only
         sleeps, and the card carries the instruction for getting runs to appear here. -->
    <div class="nx-card flex flex-col items-center gap-3 px-6 py-14 text-center">
      <app-n-bot mood="sleeping" [size]="88" label="No pipelines connected" />
      <p class="text-base font-semibold text-nx-text">{{ t('pipelines.empty') }}</p>
      <p class="max-w-md text-sm leading-relaxed text-nx-text-2">
        Set up CI/CD (e.g. GitHub Actions) on a connected repository to see build and deploy
        runs here.
      </p>
    </div>

  </div>
</div>
