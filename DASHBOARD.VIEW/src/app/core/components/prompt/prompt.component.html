<!-- Header -->
<div class="flex items-center justify-between border-b border-slate-800/80 pb-4">
  <h3 class="text-sm font-semibold text-white">{{ options.title }}</h3>
  <button type="button" (click)="cancel()"
    class="rounded-lg p-1.5 text-slate-500 transition hover:bg-slate-800 hover:text-white">
    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
    </svg>
  </button>
</div>

<!-- Input -->
<div class="mt-4">
  @if (options.label) {
    <label class="mb-1.5 block text-xs font-medium text-slate-400">
      {{ options.label }}
    </label>
  }
  <input
    #inputEl
    type="text"
    class="field-input w-full"
    [placeholder]="options.placeholder ?? ''"
    [ngModel]="value()"
    (ngModelChange)="value.set($event)"
    (keydown)="onKeydown($event)"
  />
</div>

<!-- Actions -->
<div class="mt-5 flex justify-end gap-2">
  <button type="button"
    class="nx-btn nx-btn--sm"
    (click)="cancel()">
    {{ cancelText }}
  </button>
  <button type="button"
    class="nx-btn nx-btn--primary nx-btn--sm"
    (click)="confirm()">
    {{ confirmText }}
  </button>
</div>
