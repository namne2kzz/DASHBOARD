@if (svc.isLoading()) {
  <div class="fixed inset-0 z-[9990] flex items-center justify-center bg-[rgb(13_17_23/.42)] ">
    <div class="nx-card flex flex-col items-center gap-3 px-8 py-6">
      <div class="h-10 w-10 animate-spin rounded-full border-4 border-nx-border border-t-nx-accent"></div>
      <span class="text-sm font-medium text-nx-text-2">{{ 'common.loading' | resource }}</span>
    </div>
  </div>
}
