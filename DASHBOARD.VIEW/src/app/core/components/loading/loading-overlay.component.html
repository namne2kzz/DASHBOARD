@if (svc.isLoading()) {
  <div class="fixed inset-0 z-[9990] flex items-center justify-center bg-black/30 backdrop-blur-sm">
    <div class="flex flex-col items-center gap-3 rounded-xl bg-white px-8 py-6 shadow-xl">
      <div class="h-10 w-10 animate-spin rounded-full border-4 border-slate-200 border-t-sky-500"></div>
      <span class="text-sm font-medium text-slate-600">{{ 'common.loading' | resource }}</span>
    </div>
  </div>
}
