<!-- Header: icon + title + close -->
<div class="flex items-center gap-3 border-b border-slate-800/80 pb-4">
  <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl ring-1"
    [ngClass]="iconClass">
    @switch (type) {
      @case ('danger') {
        <!-- Exclamation triangle -->
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.942 3.374h14.71c1.73 0 2.813-1.874 1.943-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
        </svg>
      }
      @case ('warning') {
        <!-- Exclamation circle -->
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 9v3.75m0 3.75h.007v.008H12v-.008zM21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/>
        </svg>
      }
      @case ('info') {
        <!-- Information circle -->
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zm-9-3.75h.008v.008H12V8.25z"/>
        </svg>
      }
      @case ('success') {
        <!-- Check circle -->
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/>
        </svg>
      }
    }
  </div>

  <h3 class="flex-1 text-sm font-semibold text-white">{{ titleDisplay }}</h3>

  <button type="button" (click)="cancel()"
    class="rounded-lg p-1.5 text-slate-500 transition hover:bg-slate-800 hover:text-white">
    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
    </svg>
  </button>
</div>

<!-- Message -->
<p class="mt-4 text-sm text-slate-400 leading-relaxed">
  @if (options.subject) {
    <span class="font-semibold text-white">{{ options.subject }}</span>{{ ' ' }}
  }
  {{ descDisplay }}
</p>

<!-- Actions -->
<div class="mt-5 flex justify-end gap-2">
  <button type="button"
    class="rounded-lg border border-slate-700 bg-slate-800/60 px-4 py-2 text-xs font-medium text-slate-300 transition hover:bg-slate-700 hover:text-white"
    (click)="cancel()">
    {{ cancelDisplay }}
  </button>
  <button type="button"
    class="rounded-lg px-4 py-2 text-xs font-semibold transition"
    [ngClass]="confirmBtnClass"
    (click)="confirm()">
    {{ confirmDisplay }}
  </button>
</div>
