@for (entry of svc.dialogs(); track trackById($index, entry)) {
  <div
    class="fixed inset-0 z-[9980] flex items-center justify-center bg-black/40  animate-fade-in"
    (click)="close(entry)"
  >
    <div
      class="relative flex flex-col border border-slate-700 bg-slate-900 shadow-2xl max-h-screen overflow-hidden animate-scale-in"
      [ngClass]="panelClass(entry)"
      [ngStyle]="panelStyle(entry)"
      (click)="$event.stopPropagation()"
    >
      <!-- Header -->
      @if (entry.config.title || entry.config.closable) {
        <div class="flex shrink-0 items-center justify-between border-b border-slate-800/80 px-6 py-4">
          @if (entry.config.title) {
            <h2 class="text-sm font-semibold text-white truncate">{{ entry.config.title }}</h2>
          }
          @if (entry.config.closable) {
            <div class="ml-auto flex items-center gap-1">
              <button
                class="rounded-lg p-1.5 text-slate-500 hover:text-white hover:bg-slate-800 transition-colors"
                (click)="toggleMaximize(entry)"
                [attr.aria-label]="entry.config.mode === 'max' ? 'Restore' : 'Maximize'"
              >
                @if (entry.config.mode === 'max') {
                  <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 9V4.5M9 9H4.5M9 9 3.5 3.5M15 9V4.5M15 9h4.5M15 9l5.5-5.5M9 15v4.5M9 15H4.5M9 15l-5.5 5.5M15 15v4.5M15 15h4.5M15 15l5.5 5.5" />
                  </svg>
                } @else {
                  <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.75 9V3.75H9M15 3.75h5.25V9M20.25 15v5.25H15M9 20.25H3.75V15" />
                  </svg>
                }
              </button>
              <button
                class="rounded-lg p-1.5 text-slate-500 hover:text-white hover:bg-slate-800 transition-colors"
                (click)="close(entry)"
                [attr.aria-label]="'dialog.close' | resource"
              >
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
              </button>
            </div>
          }
        </div>
      }

      <!-- Content -->
      <div class="custom-scroll flex-1 overflow-y-auto px-6 py-4">
        <ng-container
          [ngComponentOutlet]="entry.component"
          [ngComponentOutletInjector]="injectorFor(entry)"
        />
      </div>
    </div>
  </div>
}
