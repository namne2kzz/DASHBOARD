<!-- All five moods share the head and differ only from the eyes up, which is what keeps
     them readable as one character. Coordinates come from the v2 design system sheet. -->
<svg class="nb" [attr.width]="size()" [attr.height]="size()" viewBox="0 0 64 64"
     xmlns="http://www.w3.org/2000/svg"
     [attr.role]="label() ? 'img' : null"
     [attr.aria-label]="label() || null"
     [attr.aria-hidden]="label() ? null : 'true'">

  @if (hasAntenna()) {
    <line class="nb-antenna" x1="32" y1="10" x2="32" y2="4.5" />
    <circle cx="32" cy="4" r="2.6" [attr.fill]="tipColor()" />
  }

  <polygon class="nb-head" points="32,10 52.8,22 52.8,46 32,58 11.2,46 11.2,22" />

  @switch (mood()) {
    @case ('happy') {
      <path class="nb-eye-arc nb-eye-arc--left"  d="M20 35 Q24 27 28 35" />
      <path class="nb-eye-arc nb-eye-arc--right" d="M36 35 Q40 27 44 35" />
      <path class="nb-mouth" d="M27 42 Q32 46 37 42" />
    }
    @case ('sleeping') {
      <rect class="nb-eye--left"  x="20" y="33" width="8" height="3" rx="1.5" />
      <rect class="nb-eye--right" x="36" y="33" width="8" height="3" rx="1.5" />
      <text class="nb-z" x="48" y="16">z</text>
      <text class="nb-z nb-z--small" x="54" y="9">z</text>
    }
    @case ('maintenance') {
      <path class="nb-hat" d="M15 20 Q32 0 49 20 Z" />
      <rect class="nb-hat-brim" x="10" y="18" width="44" height="5" rx="2.5" />
      <rect class="nb-hat-brim" x="30.5" y="6" width="3" height="12" rx="1.5" />
      <rect class="nb-eye--left"  x="21.5" y="28" width="5.5" height="13" rx="1.5" />
      <rect class="nb-eye--right" x="37"   y="28" width="5.5" height="13" rx="1.5" />
      <polygon class="nb-stroke" points="21.5,28 27,28 42.5,41 37,41" />
    }
    @case ('error') {
      <path class="nb-cross nb-cross--left"  d="M20 28 L28 36 M28 28 L20 36" />
      <path class="nb-cross nb-cross--right" d="M36 28 L44 36 M44 28 L36 36" />
      <path class="nb-mouth" d="M26 45 Q32 41 38 45" />
    }
    @default {
      <rect class="nb-eye--left"  x="21.5" y="25" width="5.5" height="16" rx="1.5" />
      <rect class="nb-eye--right" x="37"   y="25" width="5.5" height="16" rx="1.5" />
      <polygon class="nb-stroke" points="21.5,25 27,25 42.5,41 37,41" />
    }
  }
</svg>
