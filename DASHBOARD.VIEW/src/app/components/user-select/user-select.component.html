<div class="relative">
  <!-- Trigger -->
  <button type="button" (click)="toggle(); $event.stopPropagation()"
    class="field-input flex w-full items-center gap-2 text-left">
    @if (selectedUser(); as u) {
      <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-[10px] font-semibold text-white" [ngClass]="u.avatarClass">{{ initials(u.name) }}</span>
      <span class="min-w-0 flex-1 truncate">{{ u.name }}</span>
    } @else {
      <span class="min-w-0 flex-1 truncate text-slate-500">{{ placeholder() }}</span>
    }
    <svg class="h-3.5 w-3.5 shrink-0 text-slate-500 transition-transform" [class.rotate-180]="open()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <path stroke-linecap="round" d="M6 9l6 6 6-6"/>
    </svg>
  </button>

  <!-- Dropdown -->
  @if (open()) {
    <div appFlipDrop class="absolute left-0 right-0 top-full z-50 mt-1 overflow-hidden rounded-xl border border-slate-700 bg-slate-800 shadow-2xl"
      (click)="$event.stopPropagation()">
      <div class="border-b border-slate-700/60 p-2">
        <input type="text" placeholder="Search users…"
          class="field-input !h-7 !text-xs w-full"
          [ngModel]="search()" (ngModelChange)="search.set($event)" />
      </div>

      <div class="custom-scroll max-h-56 overflow-y-auto py-1">
        @if (allowClear()) {
          <button type="button" (click)="pick(null)"
            class="flex w-full items-center gap-2 px-3 py-2 text-left text-xs transition hover:bg-slate-700/60"
            [class.text-sky-300]="selectedId() === null"
            [class.text-slate-400]="selectedId() !== null">
            <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full border border-dashed border-slate-600 text-slate-500">—</span>
            {{ clearLabel() }}
          </button>
        }

        @for (u of filtered(); track u.id) {
          <button type="button" (click)="pick(u.id)"
            class="flex w-full items-center gap-2 px-3 py-2 text-left transition hover:bg-slate-700/60">
            <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-[10px] font-semibold text-white" [ngClass]="u.avatarClass">{{ initials(u.name) }}</span>
            <span class="min-w-0 flex-1">
              <span class="block truncate text-xs font-medium"
                [class.text-sky-300]="u.id === selectedId()"
                [class.text-slate-200]="u.id !== selectedId()">{{ u.name }}</span>
              @if (u.email) { <span class="block truncate text-[10px] text-slate-500">{{ u.email }}</span> }
            </span>
            @if (u.id === selectedId()) {
              <svg class="h-3.5 w-3.5 shrink-0 text-sky-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20 6L9 17l-5-5"/>
              </svg>
            }
          </button>
        } @empty {
          <p class="px-3 py-3 text-center text-xs text-slate-500">No users found.</p>
        }
      </div>
    </div>
  }
</div>
