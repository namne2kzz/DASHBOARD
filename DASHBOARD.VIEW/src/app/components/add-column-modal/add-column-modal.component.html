<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm"
  (click)="cancelled.emit()"
>
  <div
    class="w-full max-w-md rounded-xl border border-slate-700 bg-slate-900 p-6 shadow-2xl"
    (click)="$event.stopPropagation()"
  >
    <h3 class="mb-5 text-base font-semibold text-slate-100">Add column</h3>

    <div class="space-y-4">

      <!-- Name -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-slate-400">
          Column name <span class="text-red-400">*</span>
        </label>
        <input
          type="text"
          maxlength="100"
          placeholder="e.g. In Progress"
          class="rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none placeholder:text-slate-600 focus:border-sky-400"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
          (keydown.enter)="submit()"
        />
      </div>

      <!-- Mapped state -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-slate-400">Mapped state</label>
        <select
          class="rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-sky-400"
          [ngModel]="mappedState()"
          (ngModelChange)="mappedState.set($event)"
        >
          @for (opt of stateOptions; track opt.value) {
            <option [value]="opt.value">{{ opt.label }}</option>
          }
        </select>
      </div>

      <!-- WIP limit + Mode -->
      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-medium text-slate-400">
            WIP limit <span class="text-slate-600">(0 = ∞)</span>
          </label>
          <input
            type="number"
            min="0"
            class="rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-sky-400"
            [ngModel]="wipLimit()"
            (ngModelChange)="wipLimit.set(+$event || 0)"
          />
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-medium text-slate-400">WIP mode</label>
          <select
            class="rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-sky-400"
            [ngModel]="wipMode()"
            (ngModelChange)="wipMode.set($event)"
          >
            <option value="soft">Soft-warning</option>
            <option value="hard">Hard-stop</option>
          </select>
        </div>
      </div>

      <!-- Aging limit -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-slate-400">Aging limit (days)</label>
        <input
          type="number"
          min="1"
          class="rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-sky-400"
          [ngModel]="agingDays()"
          (ngModelChange)="agingDays.set(+$event || 1)"
        />
      </div>

    </div>

    <!-- Footer -->
    <div class="mt-6 flex justify-end gap-2">
      <button
        type="button"
        class="rounded-lg bg-slate-700 px-4 py-2 text-sm font-semibold text-slate-200 transition hover:bg-slate-600"
        (click)="cancelled.emit()"
      >Cancel</button>
      <button
        type="button"
        class="rounded-lg bg-sky-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-sky-500 disabled:opacity-50"
        [disabled]="!name().trim()"
        (click)="submit()"
      >Add column</button>
    </div>
  </div>
</div>
