<!-- Only the hexagon — no antenna. The antenna belongs to the N-bot character on the NMate
     launcher, not to the product mark. The viewBox is cropped to the hexagon's own bounding
     box (plus the 3px stroke), so the mark fills the box it is given rather than floating in
     the padding the original drawing grid left around it. -->
<svg class="nx-logo" [class.nx-logo--on-dark]="onDark()"
     [attr.width]="size()" [attr.height]="size()" viewBox="4.46 6.46 55.08 55.08"
     xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <polygon class="nx-logo__head" points="32,10 52.8,22 52.8,46 32,58 11.2,46 11.2,22" />
  <rect class="nx-logo__eye nx-logo__eye--left"  x="21.5" y="25" width="5.5" height="16" rx="1.5" />
  <rect class="nx-logo__eye nx-logo__eye--right" x="37"   y="25" width="5.5" height="16" rx="1.5" />
  <polygon class="nx-logo__stroke" points="21.5,25 27,25 42.5,41 37,41" />
</svg>
