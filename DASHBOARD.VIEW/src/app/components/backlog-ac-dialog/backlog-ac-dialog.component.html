<div class="space-y-4">

  <!-- Criteria rows -->
  <div class="overflow-hidden rounded-lg border border-slate-700">
    <table class="w-full text-sm">
      <thead>
        <tr class="border-b border-slate-700 bg-slate-900/60">
          <th class="w-16 px-3 py-2 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">ID</th>
          <th class="px-3 py-2 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Acceptance Criteria</th>
          <th class="w-10"></th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-800">
        @for (row of rows(); track $index; let idx = $index) {
          <tr class="group">
            <td class="px-3 py-2 align-top">
              <span class="font-mono text-xs font-semibold text-sky-400">AC{{ idx + 1 }}</span>
            </td>
            <td class="px-3 py-2">
              <textarea
                [name]="'ac-' + idx"
                rows="2"
                placeholder="Given … When … Then …"
                class="custom-scroll w-full resize-none bg-transparent text-sm text-slate-100 placeholder-slate-600 outline-none"
                [ngModel]="row"
                (ngModelChange)="updateRow(idx, $event)"
              ></textarea>
            </td>
            <td class="px-2 py-2 align-top">
              <button
                type="button"
                class="rounded p-1 text-slate-600 opacity-0 transition hover:text-rose-400 group-hover:opacity-100"
                title="Remove"
                (click)="removeRow(idx)"
              >
                <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <!-- Add row -->
  <button
    type="button"
    class="flex items-center gap-1.5 text-xs font-semibold text-slate-500 transition hover:text-sky-400"
    (click)="addRow()"
  >
    <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
    </svg>
    Add criteria
  </button>

  <!-- Actions -->
  <div class="flex justify-end gap-3 border-t border-slate-800 pt-4">
    <button
      type="button"
      class="rounded-lg px-4 py-2 text-sm font-medium text-slate-400 ring-1 ring-slate-700 transition hover:ring-slate-600 hover:text-slate-200"
      (click)="cancel()"
    >Cancel</button>
    <button
      type="button"
      class="rounded-lg bg-sky-500 px-4 py-2 text-sm font-semibold text-white transition hover:bg-sky-400 disabled:cursor-not-allowed disabled:opacity-40"
      [disabled]="!canSave()"
      (click)="save()"
    >Save</button>
  </div>

</div>
