<div class="space-y-4">

  <!-- Document list -->
  @if (isEmpty()) {
    <div class="rounded-lg border border-dashed border-slate-700 py-8 text-center">
      <p class="text-sm text-slate-500">No documents attached yet</p>
    </div>
  } @else {
    <ul class="divide-y divide-slate-800 rounded-lg border border-slate-800">
      @for (doc of docs(); track $index; let idx = $index) {
        <li class="flex items-center gap-3 px-3 py-2.5">

          @if (editIndex() === idx) {
            <!-- Inline edit row -->
            <input
              type="text"
              name="editValue"
              class="min-w-0 flex-1 rounded-lg border border-sky-500 bg-slate-950 px-2.5 py-1.5 text-sm text-slate-100 outline-none"
              [ngModel]="editValue()"
              (ngModelChange)="editValue.set($event)"
              (keydown.enter)="confirmEdit()"
              (keydown.escape)="cancelEdit()"
            />
            <button
              type="button"
              class="shrink-0 rounded-lg bg-sky-600 px-2.5 py-1.5 text-xs font-semibold text-white hover:bg-sky-500 transition"
              (click)="confirmEdit()"
            >Save</button>
            <button
              type="button"
              class="shrink-0 rounded-lg px-2.5 py-1.5 text-xs text-slate-400 ring-1 ring-slate-700 hover:text-slate-200 transition"
              (click)="cancelEdit()"
            >Cancel</button>
          } @else {
            <!-- Display row -->
            <span class="min-w-0 flex-1 truncate text-sm text-slate-200" [title]="doc">{{ doc }}</span>
            <button
              type="button"
              class="shrink-0 rounded p-1.5 text-slate-500 hover:text-sky-400 transition"
              title="Edit"
              (click)="startEdit(idx)"
            >
              <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
              </svg>
            </button>
            <button
              type="button"
              class="shrink-0 rounded p-1.5 text-slate-500 hover:text-rose-400 transition"
              title="Delete"
              (click)="deleteDoc(idx)"
            >
              <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
              </svg>
            </button>
          }

        </li>
      }
    </ul>
  }

  <!-- Add new document -->
  <div class="flex gap-2">
    <input
      type="text"
      name="newDoc"
      placeholder="Document title or link"
      class="min-w-0 flex-1 rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 placeholder-slate-600 outline-none transition-colors focus:border-sky-500"
      [ngModel]="newDoc()"
      (ngModelChange)="newDoc.set($event)"
      (keydown.enter)="addDoc()"
    />
    <button
      type="button"
      class="shrink-0 rounded-lg bg-slate-700 px-3 py-2 text-sm font-semibold text-slate-100 transition hover:bg-slate-600 disabled:cursor-not-allowed disabled:opacity-40"
      [disabled]="!canAddNew()"
      (click)="addDoc()"
    >Add</button>
  </div>

  <!-- Actions -->
  <div class="flex justify-end gap-3 border-t border-slate-800 pt-4">
    <button
      type="button"
      class="rounded-lg px-4 py-2 text-sm font-medium text-slate-400 ring-1 ring-slate-700 transition hover:ring-slate-600 hover:text-slate-200"
      (click)="cancel()"
    >Cancel</button>
    <button
      type="button"
      class="rounded-lg bg-sky-500 px-4 py-2 text-sm font-semibold text-white transition hover:bg-sky-400"
      (click)="save()"
    >Save</button>
  </div>

</div>
