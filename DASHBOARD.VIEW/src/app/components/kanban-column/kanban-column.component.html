<!--
  Nexus UI column: no tinted panel. Header = name + mono count over a 2px rule;
  over WIP turns only the rule + count + one line of text red (hard) / amber (soft).
-->
<section class="flex w-[300px] shrink-0 flex-col gap-2">
  <header
    class="flex flex-col gap-1 border-b-2 px-0.5 pb-2"
    [class.border-rose-500]="wipExceeded() && wipMode() === 'hard'"
    [class.border-amber-500]="wipExceeded() && wipMode() !== 'hard'"
    [class.border-slate-800]="!wipExceeded()"
  >
    <div class="flex items-center gap-2">
      <h2 class="truncate text-sm font-semibold text-slate-100">{{ title() }}</h2>
      <span
        class="font-mono text-xs"
        [class.text-rose-500]="wipExceeded() && wipMode() === 'hard'"
        [class.text-amber-500]="wipExceeded() && wipMode() !== 'hard'"
        [class.text-slate-500]="!wipExceeded()"
        [title]="wipLimit() > 0
          ? tasks().length + ' item' + (tasks().length === 1 ? '' : 's') + ' · WIP limit ' + wipLimit()
          : tasks().length + ' item' + (tasks().length === 1 ? '' : 's')"
      >{{ tasks().length }}{{ wipLimit() > 0 ? ' / ' + wipLimit() : '' }}</span>
    </div>
    @if (wipExceeded()) {
      @if (wipMode() === 'hard') {
        <span class="text-xs text-rose-500">Over WIP — not accepting items</span>
      } @else {
        <span class="text-xs text-amber-500">Over WIP limit of {{ wipLimit() }}</span>
      }
    }
  </header>

  <div
    cdkDropList
    [id]="listId()"
    [cdkDropListData]="tasks()"
    [cdkDropListEnterPredicate]="enterPredicate()"
    class="flex min-h-[320px] flex-1 flex-col gap-2 rounded-2xl transition-colors"
    (cdkDropListDropped)="onDrop($event)"
  >
    @for (t of tasks(); track t.id) {
      <div cdkDrag [cdkDragData]="t">
        <app-task-card [task]="t" [agingLimitDays]="agingLimitDays()" (opened)="opened.emit($event)" />
      </div>
    }
  </div>
</section>
