<button
  type="button"
  class="nav-item w-full"
  [class.justify-center]="collapsed()"
  [class.px-2]="collapsed()"
  [class.is-active]="open()"
  (click)="toggle.emit()"
  title="Notifications"
>
  <span class="nav-icon relative">
    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0 1 18 14.158V11a6.002 6.002 0 0 0-4-5.659V5a2 2 0 1 0-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 1 1-6 0v-1m6 0H9"/>
    </svg>
    @if (notiSvc.unreadCount() > 0 && collapsed()) {
      <span class="badge">{{ notiSvc.unreadCount() > 99 ? '99+' : notiSvc.unreadCount() }}</span>
    }
  </span>
  @if (!collapsed()) {
    <span class="flex-1 text-left">Notifications</span>
    @if (notiSvc.unreadCount() > 0) {
      <span class="badge-inline">{{ notiSvc.unreadCount() > 99 ? '99+' : notiSvc.unreadCount() }}</span>
    }
  }
</button>
