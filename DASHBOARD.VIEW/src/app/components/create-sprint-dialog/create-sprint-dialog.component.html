<form class="space-y-5" (ngSubmit)="submit()">

  <div>
    <label class="mb-2 block text-xs font-semibold uppercase tracking-wide text-slate-400">
      Name <span class="text-rose-400">*</span>
    </label>
    <input
      type="text"
      name="name"
      placeholder="Sprint May 2026"
      class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 text-sm text-slate-100 placeholder-slate-600 outline-none transition-colors focus:border-sky-500"
      [ngModel]="name()"
      (ngModelChange)="name.set($event)"
    />
  </div>

  <div class="grid gap-4 sm:grid-cols-2">
    <div>
      <label class="mb-2 block text-xs font-semibold uppercase tracking-wide text-slate-400">
        Start date <span class="text-rose-400">*</span>
      </label>
      <input
        type="date"
        name="startDate"
        class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 text-sm text-slate-100 outline-none transition-colors focus:border-sky-500"
        [ngModel]="startDate()"
        (ngModelChange)="startDate.set($event)"
      />
    </div>
    <div>
      <label class="mb-2 block text-xs font-semibold uppercase tracking-wide text-slate-400">
        End date <span class="text-rose-400">*</span>
      </label>
      <input
        type="date"
        name="endDate"
        class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 text-sm text-slate-100 outline-none transition-colors focus:border-sky-500"
        [ngModel]="endDate()"
        (ngModelChange)="endDate.set($event)"
      />
    </div>
  </div>

  @if (startDate() && endDate() && startDate() >= endDate()) {
    <p class="text-xs text-rose-400">End date must be after start date.</p>
  }

  @if (submitError()) {
    <p class="rounded-lg border border-rose-800 bg-rose-950/50 px-3 py-2 text-xs text-rose-300">
      {{ submitError() }}
    </p>
  }

  <p class="text-xs text-slate-500">
    Sprint is created as inactive. Activate it separately to make it the current sprint.
    Dates must not overlap any existing sprint.
  </p>

  <div class="flex justify-end gap-3 border-t border-slate-800 pt-4">
    <button
      type="button"
      class="rounded-lg px-4 py-2 text-sm font-medium text-slate-400 ring-1 ring-slate-700 transition hover:ring-slate-600 hover:text-slate-200"
      [disabled]="submitting()"
      (click)="cancel()"
    >Cancel</button>
    <button
      type="submit"
      class="rounded-lg bg-sky-500 px-4 py-2 text-sm font-semibold text-white transition hover:bg-sky-400 disabled:cursor-not-allowed disabled:opacity-40"
      [disabled]="!canSubmit()"
    >{{ submitting() ? 'Creating…' : 'Create sprint' }}</button>
  </div>

</form>
