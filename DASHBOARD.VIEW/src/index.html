<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NFlow</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- All three carry the hexagon on a transparent background, so the tab shows the mark
       rather than a dark tile. SVG first for browsers that take it; the .ico and .png follow
       for those that do not. The Apple icon is a separate, opaque file: iOS drops the alpha
       channel and would otherwise paint the mark onto black. -->
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="512x512" href="logo.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- Nexus UI v3: Plus Jakarta Sans for UI, JetBrains Mono for IDs / numbers / hours. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!--
    Apply the persisted theme and accent synchronously, before Angular bootstraps,
    to avoid a flash of the defaults on load. Keys must match StorageKeys.theme
    ('nxs.ui.theme') and StorageKeys.accent ('nxs.ui.accent'); ThemeService keeps
    both in sync after. The two are independent: theme sets the surfaces, accent
    the single hue on top of them.
  -->
  <script>
    (function () {
      var ACCENTS = ['blue', 'teal', 'slate'];
      var theme = 'dark';
      var accent = 'blue';
      try {
        theme = localStorage.getItem('nxs.ui.theme') === 'light' ? 'light' : 'dark';
        var stored = localStorage.getItem('nxs.ui.accent');
        if (ACCENTS.indexOf(stored) !== -1) accent = stored;
      } catch (e) {
        /* localStorage unavailable — fall back to the defaults above */
      }
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-accent', accent);
    })();
  </script>
  <!-- Google Identity Services — used by GoogleIdentityService for the invite-accept sign-in flow. -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
