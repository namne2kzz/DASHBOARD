<!-- viewBox is cropped tight to the hexagon's own bounding box rather than to the drawing
     grid, so at favicon sizes the mark fills the tab slot instead of floating in padding. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="4.46 6.46 55.08 55.08" width="64" height="64">
  <!-- The NFlow mark: hexagon only, transparent background, so the browser tab and any
       light or dark surface show the shape rather than a dark tile. -->
  <polygon points="32,10 52.8,22 52.8,46 32,58 11.2,46 11.2,22"
           fill="#161B22" stroke="#161B22" stroke-width="3" stroke-linejoin="round"/>
  <rect x="21.5" y="25" width="5.5" height="16" rx="1.5" fill="#8B5CF6"/>
  <rect x="37"   y="25" width="5.5" height="16" rx="1.5" fill="#F0506E"/>
  <polygon points="21.5,25 27,25 42.5,41 37,41" fill="#F5F6FA"/>
</svg>
