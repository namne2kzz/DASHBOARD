server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html references content-hashed chunk/asset filenames that change on
    # every build — it must never be served stale from cache, or the browser
    # requests chunk filenames that no longer exist and gets the SPA fallback
    # (index.html, MIME type text/html) instead of a 404.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Angular build output is content-hashed, so it's safe to cache aggressively.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
