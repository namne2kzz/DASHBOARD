server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the "api" container so the SPA and API share
    # one origin — lets us expose a single port (e.g. via a tunnel) instead of
    # two, and avoids hardcoding the API's host in the built frontend bundle.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html references content-hashed chunk/asset filenames that change on
    # every build — it must never be served stale from cache, or the browser
    # requests chunk filenames that no longer exist and gets the SPA fallback
    # (index.html, MIME type text/html) instead of a 404.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Angular build output is content-hashed, so it's safe to cache aggressively.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
